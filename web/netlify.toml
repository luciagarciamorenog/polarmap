# Netlify: la web es estática (index.html con los datos dentro).
# Se despliega desde esta carpeta; no hay paso de build.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
